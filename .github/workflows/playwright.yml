name: Playwright Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Verify SECSAUCE secrets
        run: |
          if [ "$SAUCE_USER_VAL" = "standard_user" ]; then
            echo "✅ SECSAUCE_USER coincide"
          else
            echo "❌ SECSAUCE_USER NO coincide"
          fi
          echo "Longitud SECSAUCE_USER: ${#SAUCE_USER_VAL}"

          if [ "$SAUCE_PASS_VAL" = "secret_sauce" ]; then
            echo "✅ SECSAUCE_PASSWORD coincide"
          else
            echo "❌ SECSAUCE_PASSWORD NO coincide"
          fi
          echo "Longitud SECSAUCE_PASSWORD: ${#SAUCE_PASS_VAL}"
        env:
          SAUCE_USER_VAL: ${{ secrets.SECSAUCE_USER }}
          SAUCE_PASS_VAL: ${{ secrets.SECSAUCE_PASSWORD }}

      - name: Run Playwright tests
        run: npx playwright test
        env:
          SECSAUCE_USER: ${{ secrets.SECSAUCE_USER }}
          SECSAUCE_PASSWORD: ${{ secrets.SECSAUCE_PASSWORD }}
          CURA_USER: ${{ secrets.CURA_USER }}
          CURA_PASSWORD: ${{ secrets.CURA_PASSWORD }}

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30